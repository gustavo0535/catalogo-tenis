<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Catálogo de Tênis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#151518;--line:#26262b;--txt:#f4f4f5;--mut:#9a9aa3;--acc:#d7ff3a;--blue:#2f6bff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:28px 20px 8px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(34px,8vw,64px);line-height:.9;letter-spacing:-1px;text-transform:uppercase}
h1 span{color:var(--acc)}
.count{color:var(--mut);font-size:14px;margin-top:8px}
.addbtn{background:var(--acc);color:#0b0b0d;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mut);transition:.2s}
.chip.on{background:var(--txt);color:#0b0b0d;border-color:var(--txt)}
.chips{align-items:center}
.car{display:inline-block;font-size:11px;margin-left:2px;transition:transform .2s}
.car.up{transform:rotate(180deg)}
.chips{overflow:visible!important}
.dd{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:190px;background:#17171b;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);z-index:30;animation:mdown .18s ease}
@keyframes mdown{from{opacity:0;transform:translateY(-6px)}}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--txt);padding:11px 12px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.mi:hover{background:#222228}
.mi.on{background:var(--acc);color:#0b0b0d}
.mi small{color:var(--mut);font-weight:500;font-size:12px}
.mi.on small{color:#0b0b0d}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.swatches{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:3px;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #0b0b0d;box-shadow:0 0 0 1px #3a3a42;cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--acc);transform:scale(1.12)}
.swlbl{flex:none;white-space:nowrap;font-size:12px;color:var(--mut);cursor:pointer;margin-left:2px}
.sortsel{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;position:relative;transition:transform .25s,border-color .25s;animation:in .5s both}
.card:hover{transform:translateY(-4px);border-color:#3a3a42}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.thumb{aspect-ratio:4/3;background:#000;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .5s}
.thumb img.alt{position:absolute;inset:0;opacity:0}
.card:hover .thumb img.alt{opacity:1}
.card:hover .thumb img{transform:scale(1.04)}
.badge{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.badge.tenho{color:var(--acc)}.badge.quero{color:#7fb0ff}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;font-size:18px;transition:transform .2s}
.fav:active{transform:scale(.85)}
.info{padding:14px 16px 16px}
.mk{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.nm{font-weight:700;font-size:17px;margin:4px 0 10px;line-height:1.25}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #0b0b0d;box-shadow:0 0 0 1px #3a3a42}
.pics{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,8,10,.98);display:none;overflow-y:auto}
.modal.open{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mwrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.mwrap>*{min-width:0}
@media(min-width:880px){.stage{margin-top:0}.mwrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);padding:40px 24px;align-items:start}}
.close{position:fixed;top:14px;right:14px;z-index:25;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.stage{position:relative;margin-top:50px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/2;touch-action:pan-y}
.stage img{width:100%;height:100%;object-fit:contain;transition:transform .3s;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.stage.zoom img{transform:scale(2.2);cursor:zoom-out}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
.nav.p{left:10px}.nav.n{right:10px}
.idx{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.strip img{flex:none;width:84px;height:58px;object-fit:cover;border-radius:10px;opacity:.45;cursor:pointer;border:2px solid transparent;transition:.2s}
.strip img.on{opacity:1;border-color:var(--acc)}
.side h2{overflow-wrap:anywhere;padding-right:4px;font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;margin:6px 0 14px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.spec small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.spec b{font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--txt);color:#0b0b0d}
label.l{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
textarea,.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;outline:0}
textarea{min-height:90px;resize:vertical}
textarea:focus,.inp:focus{border-color:#55555f}
.saved{font-size:12px;color:var(--acc);height:16px;margin-top:6px}
.bigfav{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.bigfav.on{background:#ff3b5c;border-color:#ff3b5c}
.del{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px solid #3a2228;background:none;color:#ff7a8f;font-weight:600;cursor:pointer}
/* add sheet */
.sheet .mwrap{max-width:560px;display:block}
.sheet h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:28px;margin:30px 0 6px}
.sheet p.h{color:var(--mut);font-size:14px;margin-bottom:8px}
.drop{border:2px dashed #3a3a42;border-radius:18px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;margin-top:6px}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prev img{width:70px;height:50px;object-fit:cover;border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{width:100%;margin:20px 0 40px;background:var(--acc);color:#0b0b0d;border:0;border-radius:14px;padding:15px;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--txt);color:#0b0b0d;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s;z-index:40}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

</div></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Nenhum tênis encontrado.</div></main>

<div class="modal" id="modal">
  <button class="close" data-close>✕</button>
  <div class="mwrap">
    <div>
      <div class="stage" id="stage"><img id="big" alt=""><button class="nav p" id="prev">‹</button><button class="nav n" id="next">›</button><div class="idx" id="idx"></div></div>

    </div>
    <div class="side">

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const S={get(k,d){try{const v=localStorage.getItem('cat_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('cat_'+k,JSON.stringify(v))}catch(e){}}};
let meta=S.get('meta',{}); // id -> {fav,status,note,size}
let filter='Todos', cor='', nikeOpen=false; let cur=null, ci=0;
const $=id=>document.getElementById(id);
const M=id=>meta[id]||(meta[id]={});
const all=()=>BASE;


const fam=s=>s.marca!=='Nike'?s.marca:/jordan/i.test(s.linha)?'Jordan':/air force/i.test(s.linha)?'Air Force':'Dunk';
function chips(){
  const fams=['Dunk','Jordan','Air Force'].filter(f=>all().some(s=>fam(s)===f));
  const cores=[...new Set(all().flatMap(s=>s.cores))];
  const nikeOn=filter==='Nike'||fams.includes(filter);
  const lbl=fams.includes(filter)?'Nike · '+filter:'Nike';
  $('chips').innerHTML=`<button class="chip ${filter==='Todos'?'on':''}" data-b="Todos">Todos</button>`+
    `<span class="dd"><button class="chip ${nikeOn?'on':''}" data-b="Nike">${lbl} <span class="car ${nikeOpen?'up':''}">▾</span></button>`+
    (nikeOpen?`<div class="menu"><button class="mi ${filter==='Nike'?'on':''}" data-b="NikeAll">Todos os Nike</button>`+fams.map(c=>`<button class="mi ${c===filter?'on':''}" data-b="${c}">${c}<small>${all().filter(s=>fam(s)===c).length}</small></button>`).join('')+`</div>`:'')+`</span>`+[...new Set(all().filter(s=>s.marca!=='Nike').map(s=>s.marca))].map(m=>`<button class="chip ${filter===m?'on':''}" data-b="${m}">${m}</button>`).join('');
  $('chips').querySelectorAll('[data-b]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const v=b.dataset.b;
    if(v==='Nike'){nikeOpen=!nikeOpen;}
    else if(v==='Todos'){filter='Todos'; nikeOpen=false;}
    else if(v==='NikeAll'){filter='Nike'; nikeOpen=false;}
    else {filter=v; nikeOpen=false;}
    chips();render()});
  $('swatches').innerHTML=cores.map(c=>`<button class="sw ${c===cor?'on':''}" data-c="${c}" title="${c}" aria-label="${c}" style="background:${COLORS[c]||'#666'}"></button>`).join('')+(cor?`<span class="swlbl">${cor} ✕</span>`:'');
  [...$('swatches').querySelectorAll('.sw')].forEach(b=>b.onclick=()=>{cor=cor===b.dataset.c?'':b.dataset.c;chips();render()});
  const l=$('swatches').querySelector('.swlbl'); if(l) l.onclick=()=>{cor='';chips();render()};
}
function match(s){
  const q=$('q').value.trim().toLowerCase();
  if(q && !(s.nome+' '+s.marca+' '+s.cores.join(' ')).toLowerCase().includes(q))return false;
  if(filter!=='Todos' && filter!=='Nike' && fam(s)!==filter)return false;
  if(filter==='Nike' && s.marca!=='Nike')return false;
  if(cor && !s.cores.includes(cor))return false;
  return true;
}
function render(){
  const list=all().filter(match);
  $('count').textContent=`${all().length} ${all().length===1?'par':'pares'}`;
  $('empty').hidden=list.length>0;
  $('grid').innerHTML=list.map((s,i)=>{const m=M(s.id);return `
  <article class="card" data-id="${s.id}" style="animation-delay:${i*60}ms">
    <div class="thumb"><img src="${s.imgs[0]}" alt="">${s.imgs[1]?`<img class="alt" src="${s.imgs[1]}" alt="">`:''}
</div>
    <div class="info"><div class="mk">${s.marca}</div><div class="nm">${esc(s.nome)}</div>
      <div class="row"><div class="dots">${s.cores.map(c=>`<span class="dot" style="background:${COLORS[c]||'#666'}" title="${c}"></span>`).join('')}</div>
      <span class="pics">📷 ${s.imgs.length} fotos</span></div></div>
  </article>`}).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{open(c.dataset.id)});
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function open(id){
  cur=all().find(s=>s.id===id);ci=0;const m=M(id);
  $('mMk').textContent=cur.marca;$('mNm').textContent=cur.nome;
  const sp=[['Marca',cur.marca],['Cores',cur.cores.join(' / ')],['Linha',cur.linha||'—'],['Cano',cur.cano||'—'],['Material',cur.material||'—'],['Fotos',cur.imgs.length]];
  $('specs').innerHTML=sp.map(([a,b])=>`<div class="spec"><small>${a}</small><b>${esc(b)}</b></div>`).join('');
  
  $('strip').innerHTML=cur.imgs.map((s,i)=>`<img src="${s}" data-i="${i}">`).join('');
  [...$('strip').children].forEach(t=>t.onclick=()=>show(+t.dataset.i));
  show(0);
  $('modal').classList.add('open');document.body.style.overflow='hidden';
}
function show(i){ci=(i+cur.imgs.length)%cur.imgs.length;$('stage').classList.remove('zoom');$('big').src=cur.imgs[ci];$('idx').textContent=`${ci+1} / ${cur.imgs.length}`;[...$('strip').children].forEach((t,j)=>t.classList.toggle('on',j===ci));$('strip').children[ci]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}

$('prev').onclick=e=>{e.stopPropagation();show(ci-1)};$('next').onclick=e=>{e.stopPropagation();show(ci+1)};
$('big').onclick=e=>{const st=$('stage');if(st.classList.contains('zoom')){st.classList.remove('zoom');return}const r=st.getBoundingClientRect();$('big').style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;st.classList.add('zoom')};
let sx=null;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null||$('stage').classList.contains('zoom'))return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)show(ci+(d<0?1:-1));sx=null});
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));document.body.style.overflow=''}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('open'))return;if(e.key==='Escape')closeAll();if(e.key==='ArrowRight')show(ci+1);if(e.key==='ArrowLeft')show(ci-1)});

function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}

chips();render();
document.addEventListener('click',()=>{if(nikeOpen){nikeOpen=false;chips()}});
</script>
